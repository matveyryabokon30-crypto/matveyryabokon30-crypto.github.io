<!doctype html><html lang="ru"><meta charset="utf-8"><title>SEKKES QA viewport</title><style>body{margin:0;background:#111923;color:#fff;font:14px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,a{min-height:32px}iframe{display:block;border:0;margin:12px auto;background:#071019}a{color:#acd4ff}</style><header><strong>QA · actual app iframe</strong><label>Ширина <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Высота <select id="height"><option>390</option><option>700</option><option selected>844</option><option>1024</option></select></label><label>Время QA <select id="qaTime"><option value="now">Текущее</option><option value="8">08:00</option><option value="18">18:00</option></select></label><label>Текст <select id="scale"><option value="100">100%</option><option value="200">200%</option></select></label><a href="index.html" target="_blank">Открыть приложение</a><span>Без платных вызовов. Это размер CSS viewport, не тест iPhone.</span><output id="metrics" aria-label="Лабораторные метрики">Ожидание загрузки</output></header><iframe id="preview" title="SEKKES preview" width="390" height="844" src="index.html#home"></iframe><script>const f=document.querySelector('iframe');if(new URLSearchParams(location.search).get('fixture')==='1')f.src='index.html?qa=fixture#home';for(const k of ['width','height'])document.getElementById(k).onchange=e=>f.setAttribute(k,e.target.value);document.getElementById('scale').onchange=e=>{f.contentWindow.localStorage.setItem('sekkes:design:v1:textSize',e.target.value);f.contentWindow.dispatchEvent(new Event('storage'))};document.getElementById('qaTime').onchange=async e=>{const mod=await import('./assets/ui/preferences.mjs');const theme=e.target.value==='now'?mod.scheduledTheme():mod.scheduledTheme(new Date(2026,8,20,Number(e.target.value)));f.contentDocument.documentElement.dataset.theme=theme;};f.addEventListener('load',()=>{let lcp=0,cls=0;const show=()=>document.getElementById('metrics').textContent='Lab: LCP '+Math.round(lcp)+'ms · CLS '+cls.toFixed(3)+' · без ограничения сети';try{new f.contentWindow.PerformanceObserver(list=>{for(const e of list.getEntries())lcp=e.startTime;show()}).observe({type:'largest-contentful-paint',buffered:true});new f.contentWindow.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)cls+=e.value;show()}).observe({type:'layout-shift',buffered:true})}catch{document.getElementById('metrics').textContent='Метрики недоступны'}});</script></html>
