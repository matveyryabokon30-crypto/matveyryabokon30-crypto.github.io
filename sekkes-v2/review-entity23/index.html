<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111;color:white;font:16px system-ui}iframe{border:0;width:390px;height:780px}button{padding:10px}</style><button id="pause">Pause</button><button id="rotate">Rotate</button><span id="state">Loading</span><br><iframe title="Entity" src="./frame.html"></iframe><script>
const f=document.querySelector('iframe');let motion=true;const send=()=>f.contentWindow.postMessage({type:'sekkes-topology-state',active:true,motion,user:0,agent:0},location.origin);addEventListener('message',e=>{if(e.source===f.contentWindow&&e.data.type==='sekkes-topology-ready'){send();document.querySelector('#state').textContent='Running · 60 colours · 8 seconds'}});document.querySelector('#pause').onclick=()=>{motion=!motion;send();document.querySelector('#pause').textContent=motion?'Pause':'Resume'};document.querySelector('#rotate').onclick=()=>{const wide=f.style.width==='780px';f.style.width=wide?'390px':'780px';f.style.height=wide?'780px':'390px'};</script>
