<!doctype html><meta charset="utf-8"><title>SEKKES release check</title><pre id="result">Checking application release…</pre><script type="module">
const o={};const out=()=>document.querySelector('#result').textContent=JSON.stringify(o,null,2);
o.controller=navigator.serviceWorker.controller?.scriptURL;o.registrations=(await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,active:r.active?.state,installing:r.installing?.state,waiting:r.waiting?.state}));out();
o.caches=(await caches.keys()).filter(k=>k.startsWith('sekkes-v2-release-'));out();
for(const key of o.caches){const c=await caches.open(key),r=await c.match(new URL('../assets/ui/app.mjs',location.href));o[key]=r?(await r.text()).includes('chatAttachments'):'missing';out()}
o.network=(await (await fetch('../assets/ui/app.mjs?release-check=2',{cache:'no-store'})).text()).includes('chatAttachments');out();
</script>
