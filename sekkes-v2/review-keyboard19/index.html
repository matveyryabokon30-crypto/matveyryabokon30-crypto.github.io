<!doctype html><meta charset="utf-8"><title>Keyboard layout regression</title><button id="run">Run keyboard cycles</button><pre id="results">Ready</pre><iframe title="Phone" src="./frame.html" style="width:390px;height:844px;border:1px solid"></iframe><script>run.onclick=()=>document.querySelector('iframe').contentWindow.postMessage('test','*');addEventListener('message',e=>{if(e.data.checks)results.textContent=e.data.checks.map(([name,ok])=>(ok?'PASS ':'FAIL ')+name).join('\n')});</script>
