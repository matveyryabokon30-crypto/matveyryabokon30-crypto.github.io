<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Диагностика голоса AI Marius</title><style>body{font:17px system-ui;margin:24px}pre{white-space:pre-wrap}button{padding:14px}</style><h1>Диагностика голоса</h1><p>Этапы последних пяти попыток разговора. Без текста, записи голоса и данных аккаунта.</p><button id="copy">Скопировать</button><pre id="log"></pre><a href="./">Вернуться</a><script type="module">const log=document.querySelector('#log');log.textContent=localStorage.getItem('sekkes.voice.diagnostic')||'Пока нет записей';document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(log.textContent);document.querySelector('#copy').textContent='Скопировано'}catch{document.querySelector('#copy').textContent='Выдели и скопируй текст ниже'}};</script></html>
