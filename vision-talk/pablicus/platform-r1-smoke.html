<!doctype html><meta charset="utf-8"><title>Pablicus Platform R1 Smoke</title><pre id="out">checking</pre><script>(async()=>{const files=['auto-update.js','share-invite.js','contacts-web.js','contacts-web.css','calls-webrtc.js','sw.js','manifest.webmanifest'];const rows=[];for(const f of files){try{const r=await fetch(f,{cache:'no-store'});rows.push(f+': '+r.status+' '+(r.ok?'PASS':'FAIL'))}catch(e){rows.push(f+': FAIL')}}document.getElementById('out').textContent=rows.join('\n')})();</script>
