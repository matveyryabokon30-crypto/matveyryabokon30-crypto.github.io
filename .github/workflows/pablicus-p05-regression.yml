name: Pablicus P05 screen first-frame regression
on:
  push:
    branches: [perf/pablicus-p05-screens-20260918]
    paths: ['tools/pablicus-p05/**', '.github/workflows/pablicus-p05-regression.yml']
permissions:
  contents: write
concurrency:
  group: pablicus-p05-regression
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build scoped P05 candidate
        run: |
          set -euo pipefail
          mkdir -p .p04-baseline .p03-baseline results
          git archive 48a2bc424bbc1fa0e5d630e970d2cb5611c877e3 vision-talk/pablicus | tar -x -C .p04-baseline
          git archive 400519b4ab66e98dfaf8fa5623e8d205c52d5dfb vision-talk/pablicus | tar -x -C .p03-baseline
          cp -a .p04-baseline/vision-talk/pablicus/. vision-talk/pablicus/
          cp tools/pablicus-p05/screen-data.js vision-talk/pablicus/
          python tools/pablicus-p05/patch.py vision-talk/pablicus
          python tools/pablicus-p05/refine.py vision-talk/pablicus
          for f in vision-talk/pablicus/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          original=Path('.p04-baseline/vision-talk/pablicus')
          current=Path('vision-talk/pablicus')
          for name in ['home-data.js','avatar-stories.js','stories-v3-core.js','stories-v3-viewer.js','chat-list-view.js','auto-update.js','vault.js','outbox.js']:
            assert (original/name).read_bytes()==(current/name).read_bytes(),name
          assert (original/'sw.js').read_text().split('const PUSH_UUID=')[1]==(current/'sw.js').read_text().split('const PUSH_UUID=')[1]
          s=Path('tools/pablicus-p04/test-build.py').read_text()
          s='\n'.join(line for line in s.splitlines() if not line.startswith('subprocess.run('))
          exec(compile(s,'p04-test-generation','exec'))
          p=Path('tools/pablicus-p04/shell-current.py')
          Path('tools/pablicus-p05/shell-current.py').write_text(p.read_text().replace('P04','P05').replace('pablicus-shell-p04-20260918','pablicus-shell-p05-20260918'))
          p=Path('tools/pablicus-release/verify-public.py')
          p.write_text(p.read_text().replace('P04','P05').replace('pablicus-shell-p04-20260918','pablicus-shell-p05-20260918'))
          PY
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium webkit
      - name: First-frame, storage and home regressions
        shell: bash
        run: |
          set +e
          failed=0
          for engine in chromium webkit; do
            timeout 180 python tools/pablicus-p05/screens.py --root vision-talk/pablicus --baseline .p04-baseline/vision-talk/pablicus --engine "$engine" || failed=1
            timeout 180 python tools/pablicus-p01r2/browser.py --root vision-talk/pablicus --engine "$engine" || failed=1
            timeout 180 python tools/pablicus-p01r2/extended.py --root vision-talk/pablicus --engine "$engine" || failed=1
            timeout 180 python tools/pablicus-p05/shell-current.py --root vision-talk/pablicus --engine "$engine" || failed=1
            timeout 180 python tools/pablicus-p04/startup-current.py --root vision-talk/pablicus --baseline .p03-baseline/vision-talk/pablicus --engine "$engine" || failed=1
          done
          exit "$failed"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-evidence
          path: |
            results/*.json
            results/*.png
            tools/pablicus-p05/
          retention-days: 14
      - name: Preserve candidate runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-runtime
          path: vision-talk/pablicus/
          retention-days: 14
      - name: Record tested candidate on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = perf/pablicus-p05-screens-20260918
          git config user.name 'Pablicus verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/pablicus/p05
          cp results/*.json docs/pablicus/p05/
          git add vision-talk/pablicus docs/pablicus/p05 tools/pablicus-release/verify-public.py
          if ! git diff --cached --quiet; then
            git commit -m 'perf(pablicus): verified P05 profile and conversation first frames'
            git push origin HEAD:refs/heads/perf/pablicus-p05-screens-20260918
          fi
