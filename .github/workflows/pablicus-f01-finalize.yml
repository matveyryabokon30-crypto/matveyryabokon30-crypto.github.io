name: Pablicus F01 finalize release
on:
  push:
    branches: [fix/pablicus-f01-finalize-20260918]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pablicus-f01-finalize-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate F01 release integrity map
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('vision-talk/pablicus')
          mp=root/'release-p01r2.json'
          m=json.loads(mp.read_text())
          m['release']='P06-F01'
          assets=m['assets']
          for name in list(assets):
              p=root/('index.html' if name=='./' else name)
              assets[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          swp=root/'sw.js'
          sw=swp.read_text()
          sw=re.sub(r"const VERSION='[^']+';", "const VERSION='pablicus-shell-f01-20260918';", sw, count=1)
          sw=re.sub(r'const ASSETS=.*?;\n', 'const ASSETS='+json.dumps(assets,separators=(',',':'))+';\n', sw, count=1)
          swp.write_text(sw)
          PY
          python tools/pablicus-f01/test.py
          python tools/pablicus-p06/test.py
          node --check vision-talk/pablicus/app.js
          node --check vision-talk/pablicus/sw.js
      - name: Commit finalized runtime metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pablicus-f01-finalize.yml
          git add vision-talk/pablicus/release-p01r2.json vision-talk/pablicus/sw.js
          git commit -m "release(pablicus): finalize F01 integrity and cache"
          git push origin HEAD:fix/pablicus-f01-finalize-20260918
