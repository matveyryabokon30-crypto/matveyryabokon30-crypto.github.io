name: Pablicus P04 first-frame regression
on:
  push:
    branches: [perf/pablicus-p04-first-frame-20260918]
    paths: ['tools/pablicus-p04/**', '.github/workflows/pablicus-p04-regression.yml']
permissions:
  contents: write
concurrency:
  group: pablicus-p04-regression
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from owner-confirmed P03
        run: |
          set -euo pipefail
          mkdir -p .p04-baseline results
          git archive 400519b4ab66e98dfaf8fa5623e8d205c52d5dfb vision-talk/pablicus | tar -x -C .p04-baseline
          cp -a .p04-baseline/vision-talk/pablicus/. vision-talk/pablicus/
          python tools/pablicus-p04/patch.py vision-talk/pablicus
          python tools/pablicus-p04/test-build.py
          python -m py_compile tools/pablicus-p04/*py
          for f in vision-talk/pablicus/*.js; do node --check "$f"; done
      - name: Install browser verification
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium webkit
      - name: Compare actual first visible frames and warm restart
        run: |
          failed=0
          for engine in chromium webkit; do
            python tools/pablicus-p04/startup-current.py --root vision-talk/pablicus --baseline .p04-baseline/vision-talk/pablicus --engine "$engine" || failed=1
          done
          exit "$failed"
      - name: Media and account isolation regression
        if: always()
        run: |
          failed=0
          for engine in chromium webkit; do
            python tools/pablicus-p01r2/browser.py --root vision-talk/pablicus --engine "$engine" || failed=1
            python tools/pablicus-p01r2/extended.py --root vision-talk/pablicus --engine "$engine" || failed=1
            python tools/pablicus-p04/shell-current.py --root vision-talk/pablicus --engine "$engine" || failed=1
          done
          exit "$failed"
      - name: Preserve evidence and inspectable runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-evidence
          path: |
            results/
            tools/pablicus-p04/*py
            vision-talk/pablicus/release-p04.json
          retention-days: 14
      - name: Preserve runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-runtime
          path: vision-talk/pablicus/
          retention-days: 14
      - name: Commit passing candidate on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = perf/pablicus-p04-first-frame-20260918
          git config user.name 'Pablicus verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/pablicus/p04
          cp results/*.json docs/pablicus/p04/
          git add vision-talk/pablicus docs/pablicus/p04 tools/pablicus-release/verify-public.py
          if ! git diff --cached --quiet; then
            git commit -m 'perf(pablicus): verified P04 complete first-frame candidate'
            git push origin HEAD:refs/heads/perf/pablicus-p04-first-frame-20260918
          fi
