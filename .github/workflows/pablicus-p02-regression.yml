name: Pablicus P02 first-load regression
on:
  push:
    branches: [perf/pablicus-p02-first-load-20260918]
    paths: ['tools/pablicus-p02/**', '.github/workflows/pablicus-p02-regression.yml']
permissions:
  contents: write
concurrency:
  group: pablicus-p02-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.4.5'
      - name: Build candidate from the owner-confirmed baseline
        run: |
          set -euo pipefail
          mkdir -p .p02-baseline results/fixtures
          git archive 3c4a42edb803203277611304a5e759d1af38dd81 vision-talk/pablicus | tar -x -C .p02-baseline
          cp -a .p02-baseline/vision-talk/pablicus/. vision-talk/pablicus/
          cp tools/pablicus-p02/media-preview-client.js vision-talk/pablicus/
          python tools/pablicus-p02/patch.py vision-talk/pablicus
          for f in vision-talk/pablicus/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/pablicus-release/verify-public.py')
          s=p.read_text().replace('P01-R2','P02').replace('pablicus-shell-p01r2-20260917','pablicus-shell-p02-20260918')
          p.write_text(s)
          p=Path('tools/pablicus-p01r2/shell.py')
          s=p.read_text().replace('P01-R2','P02').replace('pablicus-shell-p01r2-20260917','pablicus-shell-p02-20260918')
          Path('tools/pablicus-p02/shell-current.py').write_text(s)
          PY
      - name: Install verification tools
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium webkit
      - name: Generate reproducible non-private source and actual derivatives
        run: |
          python - <<'PY'
          import random
          from PIL import Image
          im=Image.frombytes('RGB',(2000,1800),random.Random(20260918).randbytes(2000*1800*3))
          im.save('results/fixtures/original.jpg',quality=99,subsampling=0)
          PY
          deno run --allow-read --allow-write --allow-env --allow-net tools/pablicus-p02/raster-test.ts
      - name: Actual backend authorization and derivative integration on isolated fixtures
        run: deno run --allow-read --allow-write --allow-env --allow-net tools/pablicus-p02/backend-test.ts
      - name: Media and complete application regression
        shell: bash
        run: |
          set +e
          failed=0
          for engine in chromium webkit; do
            python tools/pablicus-p01r2/browser.py --root vision-talk/pablicus --engine "$engine" || failed=1
            python tools/pablicus-p01r2/extended.py --root vision-talk/pablicus --engine "$engine" || failed=1
            python tools/pablicus-p02/shell-current.py --root vision-talk/pablicus --engine "$engine" || failed=1
            python tools/pablicus-p02/browser.py --root vision-talk/pablicus --engine "$engine" || failed=1
          done
          exit "$failed"
      - name: Confirm production preview endpoint rejects anonymous callers
        run: |
          code=$(curl --max-time 20 -sS -o /tmp/p02-anon -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"resolve","items":[]}' 'https://ctcoqgsztdtsazdiwcmd.supabase.co/functions/v1/pablicus-media-preview')
          test "$code" = 401
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-regression-evidence
          path: |
            results/*.json
            results/*.png
            vision-talk/pablicus/release-p02.json
          retention-days: 14
      - name: Save candidate for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-runtime
          path: vision-talk/pablicus/
          retention-days: 14
      - name: Record passing candidate only on feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = perf/pablicus-p02-first-load-20260918
          git config user.name 'Pablicus verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/pablicus/p02
          cp results/*.json docs/pablicus/p02/
          git add vision-talk/pablicus docs/pablicus/p02 tools/pablicus-release/verify-public.py
          if ! git diff --cached --quiet; then
            git commit -m 'perf(pablicus): verified P02 cold previews and warm-start candidate'
            git push origin HEAD:refs/heads/perf/pablicus-p02-first-load-20260918
          fi
