name: Pablicus published release verification
on:
  push:
    branches: [main]
    paths: ['vision-talk/pablicus/**', 'tools/pablicus-release/**', '.github/workflows/pablicus-platform-r1-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser checks
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify actual Pages release and both browser engines
        run: python tools/pablicus-release/verify-public.py
      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pablicus-public-verification
          path: public-evidence/
          retention-days: 14
