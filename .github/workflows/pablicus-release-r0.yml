name: Pablicus R0 verified release
on:
  push:
    branches: [fix/pablicus-f02-r0-release-20260919]
    paths: ['tools/pablicus-release/**', 'tools/pablicus-f02/**', '.github/workflows/pablicus-release-r0.yml']
permissions:
  contents: write
concurrency:
  group: pablicus-r0-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact accepted F01 baseline
        run: |
          mkdir -p baseline results
          git archive 1c37273dcfe1c06dfb91d793bb59eb88d69bb76a vision-talk/pablicus | tar -x -C baseline
      - name: Build deterministic candidate and negative integrity tests
        run: |
          set -euo pipefail
          python tools/pablicus-release/build_release.py --source-sha "$GITHUB_SHA"
          python tools/pablicus-release/test_release.py 2>&1 | tee results/unit.txt
          python tools/pablicus-f01/test.py
          python tools/pablicus-f02/test.py
          python tools/pablicus-p06/test.py
          for f in vision-talk/pablicus/*.js; do node --check "$f"; done
      - name: Install browser verification
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium webkit
      - name: Accumulated media and release lifecycle tests
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            python tools/pablicus-p01r2/browser.py --root vision-talk/pablicus --engine "$engine"
            python tools/pablicus-p01r2/extended.py --root vision-talk/pablicus --engine "$engine"
            python tools/pablicus-release/test_browser_release.py --root vision-talk/pablicus --baseline baseline/vision-talk/pablicus --engine "$engine"
          done
      - name: Finalize only the tested generated browser artifacts on isolated branch
        run: |
          set -euo pipefail
          python tools/pablicus-release/build_release.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-talk/pablicus/index.html vision-talk/pablicus/sw.js vision-talk/pablicus/release-info.js vision-talk/pablicus/release.json vision-talk/pablicus/release-p01r2.json
          git commit -m 'build(pablicus): save verified R0 immutable artifact'
          git push origin HEAD:fix/pablicus-f02-r0-release-20260919
          git rev-parse HEAD > results/GENERATED_COMMIT.txt
          cp vision-talk/pablicus/release.json results/release.json
          tar -czf results/runtime.tar.gz vision-talk/pablicus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablicus-r0-verification
          path: results/
          retention-days: 14
          if-no-files-found: error
